<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LATAM ADM • Estoque</title>

  <!-- Roboto -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />

  <style>
    /* ---------- Variáveis ---------- */
    :root{
      --latam-magenta:#c41230;
      --bg-1:#000; --bg-2:#011627; --bg-3:#1b006b;
      --card-bg:#10151f; --accent:#6d28d9;
      --text:#f1f5f9; --ok:#22c55e; --attn:#ffc107; --crit:var(--latam-magenta);
    }

    /* ---------- Reset ---------- */
    *{margin:0;padding:0;box-sizing:border-box;font-family:"Roboto",sans-serif;}

    /* ---------- Travar largura ---------- */
    html,body{max-width:100%;overflow-x:hidden;}

    /* ---------- Fundo animado ---------- */
    @keyframes bgFlow{0%{background-position:0 0;}100%{background-position:400% 0;}}
    body{
      background:linear-gradient(130deg,var(--bg-1),var(--bg-2) 45%,var(--bg-3));
      background-size:400% 400%;animation:bgFlow 25s ease infinite;
      color:var(--text);
      padding:1.4rem .8rem;
    }

    h2{color:var(--accent);margin-bottom:.9rem;}

    /* ---------- Card ---------- */
    .card{
      width:100%;
      background:var(--card-bg);
      border-radius:14px;
      box-shadow:0 6px 25px rgba(0,0,0,.45);
      padding:1.4rem 1.2rem;
      margin-bottom:.9rem;
    }

    /* ---------- Tabelas ---------- */
    #dashboard,.hist-table{overflow-x:auto;}
    table{
      width:100%;table-layout:fixed;border-collapse:collapse;font-size:.9rem;word-break:break-word;
    }
    th,td{padding:.6rem .65rem;border:1px solid #333;text-align:left;}
    th{background:#0e1621;position:sticky;top:0;z-index:5;}

    tr.ok   td{background:rgba(34,197,94,.16);}
    tr.attn td{background:rgba(255,193,7,.13);}
    tr.crit td{background:rgba(196,18,48,.20);}

    /* ---------- Formulário ---------- */
    form{display:flex;flex-direction:column;gap:.9rem;max-width:460px;}
    label{font-size:.88rem;font-weight:500;}

    /* wrapper p/ autocomplete */
    .autocomplete{position:relative;}

    input,select,textarea{
      width:100%;padding:.52rem .7rem;font-size:.9rem;
      background:#0e1621;border:1px solid #444;border-radius:8px;
      color:var(--text);outline:none;
      transition:border .2s,box-shadow .2s;
    }
    input:focus,select:focus,textarea:focus{
      border-color:var(--accent);box-shadow:0 0 0 3px rgba(109,40,217,.35);
    }
    ::placeholder{color:#6c7a8d;}
    input[type=number]{-moz-appearance:textfield;}
    input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{display:none;}

    .btn{
      align-self:flex-start;background:var(--accent);color:#fff;border:none;
      border-radius:8px;padding:.6rem 1.4rem;font-weight:500;cursor:pointer;
      transition:background .2s,transform .15s;
    }
    .btn:hover{background:#5b21b6;} .btn:active{transform:scale(.97);}

    .msg{font-size:.83rem;margin-top:.25rem;}
    .msg.success{color:var(--ok);} .msg.error{color:var(--crit);}

    /* ---------- Autocomplete ---------- */
    .autocomplete-list{
      display:none;           /* é mostrada via JS */
      position:absolute;left:0;right:0;top:100%;
      background:#0e1621;border:1px solid #444;border-top:none;
      max-height:230px;overflow-y:auto;
      border-radius:0 0 8px 8px;z-index:1000;
    }
    .autocomplete-list .option{
      padding:.55rem .7rem;cursor:pointer;white-space:nowrap;
      text-overflow:ellipsis;overflow:hidden;
    }
    .autocomplete-list .option:hover{
      background:rgba(109,40,217,.25);
    }

    /* ---------- Filtros do histórico ---------- */
    .hist-filters{
      display:flex;gap:.6rem;margin-bottom:.7rem;flex-wrap:wrap;
    }
    .hist-filters input,.hist-filters select{
      background:#0e1621;border:1px solid #444;border-radius:8px;
      padding:.45rem .6rem;font-size:.86rem;color:var(--text);
    }
    .hist-filters input{flex:1;min-width:120px;}
    .hist-filters select{flex:0 0 160px;}

    /* ---------- Mobile ---------- */
    @media(max-width:480px){
      body{padding:1rem .5rem;}
      .card{padding:1.2rem .9rem;}
      form{max-width:100%;}
      .btn{width:100%;text-align:center;}
      table{font-size:.82rem;}
      .hist-filters{flex-direction:column;}
      .hist-filters select{width:100%;}
    }
  </style>
</head>

<body>
  <!-- === DASHBOARD === -->
  <div class="card">
    <h2>Estoque Atual</h2>
    <div id="dashboard"></div>
  </div>

  <!-- === NOVA MOVIMENTAÇÃO === -->
  <div class="card">
    <h2>Nova Movimentação</h2>
    <form id="txnForm">
      <div>
        <label for="itemInput">Item</label>
        <div class="autocomplete">
          <!-- Mantém o datalist para quem estiver em desktop, mas agora há um autocomplete JS universal -->
          <input id="itemInput" type="text" list="itemsList"
                 placeholder="Comece a digitar..." autocomplete="off" required />
          <datalist id="itemsList"></datalist>
          <div id="itemSuggestions" class="autocomplete-list"></div>
        </div>
      </div>

      <div>
        <label for="txnType">Tipo</label>
        <select id="txnType" required>
          <option value="IN">Entrada</option>
          <option value="OUT">Saída</option>
        </select>
      </div>

      <div>
        <label for="quantity">Quantidade</label>
        <input type="number" id="quantity" min="1" required />
      </div>

      <div>
        <label for="notes">Observações</label>
        <textarea id="notes" rows="2" placeholder="(opcional)"></textarea>
      </div>

      <button type="submit" class="btn">Salvar</button>
      <div id="formMsg" class="msg"></div>
    </form>
  </div>

  <!-- === HISTÓRICO === -->
  <div class="card">
    <h2>Histórico de Movimentações</h2>

    <div class="hist-filters">
      <input type="text" id="histSearch" placeholder="Pesquisar item…" />
      <select id="histSort">
        <option value="new">Mais recentes</option>
        <option value="old">Mais antigas</option>
        <option value="in">Somente Entradas</option>
        <option value="out">Somente Saídas</option>
      </select>
    </div>

    <div id="history" class="hist-table"></div>
  </div>

  <script>
  /* ===== CONFIG ===== */
  const API_URL     = "https://script.google.com/macros/s/AKfycbxZ8ogL76p3vIUPZsiPLv9XnAhN1Z6KWK3IhRgKyGMUYN-2AmxQYUuO2v8i-PQxSpP_Cg/exec";
  const SHEET_ITEMS = "ESTOQUE";
  const SHEET_TXNS  = "MOVIMENTACOES";

  /* ===== VARS & UTIL ===== */
  let items=[], txns=[], stock={};
  const qs=s=>document.querySelector(s);
  const itemById=id=>items.find(i=>i.id===id)||{};
  const showMsg=(el,t,e=false)=>{el.textContent=t;el.className="msg "+(e?"error":"success");};

  async function fetchSheet(sheet,opts={}){
    const r=await fetch(`${API_URL}?sheet=${encodeURIComponent(sheet)}`,opts);
    if(!r.ok) throw new Error(await r.text());
    const ct=r.headers.get("content-type")||"";
    return ct.includes("application/json")?r.json():r.text();
  }

  /* ===== LOAD DATA ===== */
  document.addEventListener("DOMContentLoaded",async()=>{
    try{
      [items,txns]=await Promise.all([fetchSheet(SHEET_ITEMS),fetchSheet(SHEET_TXNS)]);
      calcStock();
      renderTable();
      fillDatalist();          // ainda preenche o <datalist> (desktop fallback)
      setupAutocomplete();     // novo – lista JS que funciona em todo lugar
      renderHistory();

      qs("#txnForm").addEventListener("submit",saveTxn);
      qs("#histSort").addEventListener("change",renderHistory);
      qs("#histSearch").addEventListener("input",renderHistory);
    }catch(err){alert("Erro ao carregar: "+err.message);console.error(err);}
  });

  function calcStock(){
    stock={};items.forEach(i=>stock[i.id]=0);
    txns.forEach(t=>{
      const s=t.tipo==="IN"?1:-1;
      stock[t.item]=(stock[t.item]||0)+s*Number(t.quantidade||0);
    });
  }

  /* ===== DASHBOARD ===== */
  function renderTable(){
    const dash=qs("#dashboard");
    if(!items.length){dash.innerHTML="<p>Nenhum item cadastrado.</p>";return;}
    dash.innerHTML=
      `<table>
        <thead><tr><th>Item</th><th>Unid.</th><th>Mín.</th><th>Atual</th></tr></thead>
        <tbody>${
          items.map(it=>{
            const q=stock[it.id]||0;
            const c=q<=it.minLevel?"crit":q<=it.minLevel*2?"attn":"ok";
            return `<tr class="${c}">
                      <td>${it.name}</td><td>${it.unit}</td>
                      <td>${it.minLevel}</td><td>${q}</td>
                    </tr>`;
          }).join("")
        }</tbody>
      </table>`;
  }

  /* ===== LISTA DE ITENS (datalist) ===== */
  function fillDatalist(){
    const list=qs("#itemsList");
    list.innerHTML="";
    items.forEach(i=>list.insertAdjacentHTML("beforeend",`<option value="${i.name}">`));
  }

  /* ===== NOVO AUTOCOMPLETE CROSS-DEVICE ===== */
  function setupAutocomplete(){
    const input = qs("#itemInput");
    const box   = qs("#itemSuggestions");

    function closeBox(){ box.style.display="none"; }

    // fecha ao clicar fora
    document.addEventListener("click",e=>{
      if(!e.target.closest(".autocomplete")) closeBox();
    });

    box.addEventListener("click",e=>{
      const opt=e.target.closest(".option");
      if(opt){
        input.value=opt.dataset.name;
        closeBox();
      }
    });

    input.addEventListener("input",update);
    input.addEventListener("focus",update);

    function update(){
      const val=input.value.trim().toLowerCase();
      if(!val){ closeBox(); return; }

      const matches = items
        .filter(i=>i.name.toLowerCase().includes(val))
        .slice(0,30); // limita para não estourar a tela

      if(!matches.length){ closeBox(); return; }

      box.innerHTML = matches
        .map(i=>`<div class="option" data-name="${i.name}">${i.name}</div>`)
        .join("");

      box.style.display="block";
    }
  }

  /* ===== HISTÓRICO ===== */
  function renderHistory(){
    const hist=qs("#history");
    if(!txns.length){hist.innerHTML="<p>Sem movimentações.</p>";return;}

    /* --- filtros --- */
    const mode   = qs("#histSort").value;
    const search = qs("#histSearch").value.trim().toLowerCase();

    let list=[...txns];

    if(mode==="in"||mode==="out") list=list.filter(t=>t.tipo===mode.toUpperCase());
    if(mode==="old") list.sort((a,b)=>new Date(a.data)-new Date(b.data));
    else             list.sort((a,b)=>new Date(b.data)-new Date(a.data));

    if(search) list=list.filter(t=>(itemById(t.item).name||"").toLowerCase().includes(search));

    if(!list.length){hist.innerHTML="<p>Nenhuma movimentação encontrada.</p>";return;}

    const rows=list.map(t=>{
      const sign=t.tipo==="IN"?"+":"–";
      const cor =t.tipo==="IN"?"var(--ok)":"var(--crit)";
      return `<tr>
                <td>${t.data}</td>
                <td>${itemById(t.item).name||"-"}</td>
                <td style="color:${cor};font-weight:600;">${sign}${t.quantidade}</td>
                <td>${t.usuario||"-"}</td>
                <td>${t.notas||""}</td>
              </tr>`;
    }).join("");

    hist.innerHTML=
      `<table>
        <thead><tr><th>Data</th><th>Item</th><th>Qtd</th><th>Usuário</th><th>Obs.</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  /* ===== SALVAR MOVIMENTAÇÃO ===== */
  async function saveTxn(e){
    e.preventDefault();
    const msgEl=qs("#formMsg");

    const itemName = qs("#itemInput").value.trim();
    const item     = items.find(i=>i.name.toLowerCase()===itemName.toLowerCase());
    const tipo     = qs("#txnType").value;
    const qty      = Number(qs("#quantity").value);
    const notas    = qs("#notes").value.trim();

    if(!item||qty<=0){showMsg(msgEl,"Preencha corretamente.",true);return;}

    const user=JSON.parse(localStorage.getItem("currentUser")||"{}");
    const payload={
      id:Date.now().toString(36),
      item:item.id,tipo,quantidade:qty,
      usuario:user?.nome||"Desconhecido",
      data:new Date().toISOString().split("T")[0],
      notas
    };

    try{
      await fetchSheet(SHEET_TXNS,{method:"POST",body:JSON.stringify(payload)});
      showMsg(msgEl,"Movimentação salva!");
      txns.push(payload);
      stock[item.id]=(stock[item.id]||0)+(tipo==="IN"?qty:-qty);
      renderTable();renderHistory();
      e.target.reset();
    }catch(err){showMsg(msgEl,"Erro ao salvar.",true);console.error(err);}
  }
  </script>
</body>
</html>
