<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LATAM ADM • Login</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />

  <style>
    /* ---------- Variáveis ---------- */
    :root{
      --latam-magenta:#c41230;

      /* paleta escura */
      --bg-dark-1:#000;     /* preto */
      --bg-dark-2:#011627;  /* azul-marinho */
      --bg-dark-3:#1b006b;  /* roxo escuro */
      --card-bg:#151a24;    /* cinza antracite */
      --accent:#6d28d9;     /* roxo vívido */
      --text-main:#f1f5f9;  /* branco suave */
      --text-dim:#94a3b8;   /* cinza claro */
      --success:#22c55e;
      --error:var(--latam-magenta);
    }

    /* ---------- Reset ---------- */
    *{margin:0;padding:0;box-sizing:border-box;font-family:"Roboto",sans-serif;}

    /* ---------- Animações ---------- */
    @keyframes bgFlow{0%{background-position:0 0;}100%{background-position:400% 0;}}
    @keyframes fadeSlide{0%{opacity:0;transform:translateY(24px);}100%{opacity:1;transform:translateY(0);}}

    /* ---------- Layout base ---------- */
    body{
      display:flex;align-items:center;justify-content:center;min-height:100vh;
      background:linear-gradient(130deg,var(--bg-dark-1),var(--bg-dark-2) 45%,var(--bg-dark-3));
      background-size:400% 400%;animation:bgFlow 25s ease infinite;
      color:var(--text-main);
      padding:1rem;
    }

    .card{
      background:var(--card-bg);
      width:420px;max-width:100%;
      padding:2rem 2.5rem 3rem;
      border-radius:18px;
      box-shadow:0 6px 25px rgba(0,0,0,.5);
      animation:fadeSlide .8s ease-out both;
      transition:transform .3s ease,box-shadow .3s ease;
    }
    .card:hover{transform:translateY(-4px);box-shadow:0 12px 40px rgba(0,0,0,.6);}

    /* ---------- Logo ---------- */
    .latam-logo{display:flex;align-items:center;gap:.7rem;margin-bottom:1.8rem;}
    .latam-logo-icon{
      width:36px;
      height:auto;
      object-fit:contain;
    }
    h1{font-size:1.45rem;font-weight:700;}

    /* ---------- Abas ---------- */
    .tabs{display:flex;gap:1rem;margin-bottom:1.8rem;flex-wrap:wrap;}
    .tab-btn{
      position:relative;flex:1;text-align:center;padding:.6rem;cursor:pointer;
      font-weight:500;color:var(--text-dim);user-select:none;min-width:90px;
    }
    .tab-btn::after{
      content:"";position:absolute;left:0;bottom:-3px;width:100%;height:3px;
      background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .3s;
    }
    .tab-btn.active{color:var(--accent);}
    .tab-btn.active::after{transform:scaleX(1);}

    /* ---------- Formulários ---------- */
    form{display:none;flex-direction:column;gap:1rem;}
    form.active{display:flex;}

    label{font-size:.9rem;font-weight:500;color:var(--text-main);}

    input,select{
      padding:.55rem .75rem;font-size:.95rem;background:#0e1621;
      border:1px solid #333;border-radius:8px;color:var(--text-main);
      outline:none;transition:border .2s,box-shadow .2s;
    }
    ::placeholder{color:#607088;}
    input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(109,40,217,.35);}

    /* ---------- Botão ---------- */
    .btn{
      position:relative;padding:.7rem;background:var(--accent);color:#fff;
      border:none;border-radius:8px;font-size:1rem;font-weight:500;
      cursor:pointer;overflow:hidden;transition:background .2s,transform .15s;
    }
    .btn:hover{background:#5b21b6;}
    .btn:active{transform:scale(.97);}
    .btn::after{
      content:"";position:absolute;top:50%;left:50%;width:0;height:0;border-radius:50%;
      background:rgba(255,255,255,.35);transform:translate(-50%,-50%);
      transition:width .4s ease,height .4s ease;
    }
    .btn:active::after{width:200%;height:200%;}

    /* ---------- Mensagens ---------- */
    .message{text-align:center;margin-top:.5rem;font-size:.85rem;
      opacity:0;transition:opacity .3s;color:var(--text-main);}
    .message.show{opacity:1;}
    .message.success{color:var(--success);}
    .message.error{color:var(--error);}

    /* ---------- Responsividade ---------- */
    @media (max-width:480px){
      .card{padding:1.7rem 1.5rem 2.3rem;border-radius:16px;}
      h1{font-size:1.3rem;}
      .latam-logo-icon{width:30px;}
      .tabs{gap:.6rem;margin-bottom:1.5rem;}
      .tab-btn{padding:.55rem .25rem;font-size:.9rem;}
      input,select{font-size:.9rem;}
      .btn{font-size:.95rem;}
    }
    @media (max-width:360px){
      .card{padding:1.5rem 1.1rem 2rem;border-radius:14px;}
      .tab-btn{font-size:.85rem;min-width:auto;}
      h1{font-size:1.2rem;}
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- ---------- Logo ---------- -->
    <div class="latam-logo">
      <!-- Substitua “latam-logo.svg” pelo caminho/arquivo da sua logo -->
      <img src="./assets/img/latamicon.png" alt="Logo LATAM" class="latam-logo-icon" />
      <h1>LATAM ADM</h1>
    </div>

    <!-- ---------- Abas ---------- -->
    <div class="tabs">
      <div id="loginTab"    class="tab-btn active">Login</div>
      <div id="registerTab" class="tab-btn">Cadastro</div>
      <div id="recoverTab"  class="tab-btn">Recuperar&nbsp;Senha</div>
    </div>

    <!-- ---------- Login ---------- -->
    <form id="loginForm" class="active">
      <div>
        <label for="loginUsername">Usuário</label>
        <input type="text" id="loginUsername" required placeholder="Seu usuário" />
      </div>
      <div>
        <label for="loginPassword">Senha</label>
        <input type="password" id="loginPassword" required placeholder="••••••••" />
      </div>
      <button type="submit" class="btn">Entrar</button>
      <div id="loginMsg" class="message"></div>
    </form>

    <!-- ---------- Cadastro ---------- -->
    <form id="registerForm">
      <div>
        <label for="regUsername">Usuário</label>
        <input type="text" id="regUsername" required placeholder="Novo usuário" />
      </div>
      <div>
        <label for="regPassword">Senha</label>
        <input type="password" id="regPassword" required placeholder="Crie uma senha" />
      </div>
      <div>
        <label for="regRole">Tipo de Usuário</label>
        <select id="regRole" required>
          <option value="Administrador">Administrador</option>
          <option value="Supervisor">Supervisor</option>
        </select>
      </div>
      <div>
        <label for="regKey">Chave de Permissão</label>
        <input type="password" id="regKey" required placeholder="Chave secreta" />
      </div>
      <button type="submit" class="btn">Cadastrar</button>
      <div id="regMsg" class="message"></div>
    </form>

    <!-- ---------- Recuperar Senha ---------- -->
    <form id="recoverForm">
      <div>
        <label for="recoverUsername">Usuário</label>
        <input type="text" id="recoverUsername" required placeholder="Usuário cadastrado" />
      </div>
      <div>
        <label for="recoverKey">Chave de Permissão</label>
        <input type="password" id="recoverKey" required placeholder="Chave secreta" />
      </div>
      <button type="submit" class="btn">Mostrar&nbsp;Senha</button>
      <div id="recoverMsg" class="message"></div>
    </form>
  </div>

<script>
/* ===== CONFIG ===== */
const API_URL    = "https://script.google.com/macros/s/AKfycbxZ8ogL76p3vIUPZsiPLv9XnAhN1Z6KWK3IhRgKyGMUYN-2AmxQYUuO2v8i-PQxSpP_Cg/exec";
const MASTER_KEY = "Christianzw1";

/* ===== UTIL ===== */
function showMessage(el,text,isError=false){
  el.textContent = text;
  el.className = "message " + (isError ? "error" : "success") + " show";
}
async function fetchSheet(sheet,options={}){
  const r = await fetch(`${API_URL}?sheet=${encodeURIComponent(sheet)}`,options);
  if(!r.ok) throw new Error(await r.text());
  const t = r.headers.get("content-type") || "";
  return t.includes("application/json") ? r.json() : JSON.parse(await r.text());
}

/* ===== ABAS ===== */
const tabs  = {loginTab,registerTab,recoverTab};
const forms = {loginForm,registerForm,recoverForm};

Object.keys(tabs).forEach(id=>tabs[id].addEventListener("click",()=>{
  Object.values(tabs ).forEach(t=>t.classList.remove("active"));
  Object.values(forms).forEach(f=>f.classList.remove("active"));
  tabs[id].classList.add("active");
  forms[id.replace("Tab","Form")].classList.add("active");
}));

/* ===== CADASTRO ===== */
registerForm.addEventListener("submit",async e=>{
  e.preventDefault();
  const username = regUsername.value.trim();
  const password = regPassword.value;
  const role     = regRole.value;
  const key      = regKey.value;

  if(key !== MASTER_KEY){
    showMessage(regMsg,"Chave de permissão inválida.",true);return;
  }

  try{
    const lista = await fetchSheet("usuarios");
    if(Array.isArray(lista) && lista.some(u=>u.nome===username)){
      showMessage(regMsg,"Usuário já existe.",true);return;
    }
    const novo={
      id:Date.now().toString(),
      nome:username,
      senha:password,
      tipo:role,
      dataCriacao:new Date().toISOString().split("T")[0]
    };
    await fetch(`${API_URL}?sheet=usuarios`,{method:"POST",body:JSON.stringify(novo)});
    showMessage(regMsg,"Cadastro realizado com sucesso!");
    registerForm.reset();
  }catch(err){
    console.error(err);
    showMessage(regMsg,"Erro ao salvar.",true);
  }
});

/* ===== LOGIN ===== */
loginForm.addEventListener("submit",async e=>{
  e.preventDefault();
  const username = loginUsername.value.trim();
  const password = loginPassword.value;

  try{
    const usuarios = await fetchSheet("usuarios");
    const user = Array.isArray(usuarios)
      ? usuarios.find(u=>u.nome===username && u.senha===password)
      : null;

    if(!user){
      showMessage(loginMsg,"Usuário ou senha incorretos.",true);return;
    }

    const roleLabel = user.tipo==="Supervisor"
      ? " <span style='color:var(--latam-magenta)'>(Supervisor)</span>"
      : " (Administrador)";
    showMessage(loginMsg,`Bem-vindo(a), ${user.nome}${roleLabel}!`);

    localStorage.setItem("currentUser",JSON.stringify(user));
    setTimeout(()=>location.href="inicio.html",1000);
  }catch(err){
    console.error(err);
    showMessage(loginMsg,"Falha ao conectar com o servidor.",true);
  }
});

/* ===== RECUPERAR SENHA ===== */
recoverForm.addEventListener("submit",async e=>{
  e.preventDefault();
  if(recoverKey.value !== MASTER_KEY){
    showMessage(recoverMsg,"Chave de permissão inválida.",true);return;
  }

  try{
    const usuarios = await fetchSheet("usuarios");
    const user = usuarios.find(u=>u.nome===recoverUsername.value.trim());
    if(!user){
      showMessage(recoverMsg,"Usuário não encontrado.",true);return;
    }
    showMessage(recoverMsg,`Senha de ${user.nome}: ${user.senha}`);
    recoverForm.reset();
  }catch(err){
    console.error(err);
    showMessage(recoverMsg,"Erro ao recuperar.",true);
  }
});
</script>
</body>
</html>
