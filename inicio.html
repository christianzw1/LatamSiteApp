<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LATAM ADM • Início</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />

  <style>
    /* ---------- Variáveis ---------- */
    :root{
      --latam-magenta:#c41230;

      /* paleta escura */
      --bg-dark-1:#000;
      --bg-dark-2:#011627;
      --bg-dark-3:#1b006b;
      --sidebar-bg:#0e1621;
      --card-bg:#151a24;
      --accent:#6d28d9;
      --text-main:#f1f5f9;
      --text-dim:#a0aec0;
    }

    /* ---------- Reset ---------- */
    *{margin:0;padding:0;box-sizing:border-box;font-family:"Roboto",sans-serif;}

    /* ---------- Animações ---------- */
    @keyframes bgFlow{0%{background-position:0 0;}100%{background-position:400% 0;}}
    @keyframes slideIn{from{transform:translateX(-100%);}to{transform:translateX(0);} }
    @keyframes slideOut{from{transform:translateX(0);}to{transform:translateX(-100%);} }

    /* ---------- Layout base ---------- */
    body{
      display:flex;min-height:100vh;overflow:hidden;
      background:linear-gradient(130deg,var(--bg-dark-1),var(--bg-dark-2) 45%,var(--bg-dark-3));
      background-size:400% 400%;animation:bgFlow 25s ease infinite;
      color:var(--text-main);
    }

    /* ===== SIDEBAR ===== */
    .sidebar{
      width:240px;min-height:100vh;background:var(--sidebar-bg);
      display:flex;flex-direction:column;flex-shrink:0;
      transition:transform .35s ease;
      z-index:200;
    }
    .sidebar h2{padding:1.5rem;font-size:1.25rem;font-weight:700;white-space:nowrap;}
    .nav-link,
    .logout-btn{
      position:relative;                 /* necessário p/ badge */
      padding:1rem 1.5rem;cursor:pointer;white-space:nowrap;
      transition:background .2s,color .2s;
      background-size:200% 100%;
    }
    .nav-link:hover{background:rgba(255,255,255,.06);}
    .nav-link.active{
      background:linear-gradient(130deg,var(--accent),var(--accent) 40%,#4c1db4 80%);
      color:#fff;
    }
    .logout-btn{margin-top:auto;background:rgba(255,255,255,.05);}
    .logout-btn:hover{background:rgba(255,255,255,.12);}

    /* ----- Badge ----- */
    .badge{
      position:absolute;
      top:10px;
      right:18px;
      width:12px;
      height:12px;
      border-radius:50%;
      background:var(--latam-magenta);
      display:none;
      pointer-events:none;
    }

    /* ===== MAIN ===== */
    .main{flex:1;display:flex;flex-direction:column;min-width:0;}
    .header{
      background:var(--sidebar-bg);padding:.75rem 1.5rem;
      display:flex;justify-content:space-between;align-items:center;
      box-shadow:0 2px 6px rgba(0,0,0,.5);flex-shrink:0;
    }
    .user{font-weight:500;}
    .sync-btn{
      background:var(--accent);border:none;color:#fff;
      padding:.5rem 1rem;border-radius:6px;cursor:pointer;
      transition:background .2s,transform .15s;
    }
    .sync-btn:hover{background:#5b21b6;}
    .sync-btn:active{transform:scale(.97);}

    /* ↓↓↓ CORREÇÃO AQUI ↓↓↓  */
    .content{
      flex:1;
      display:flex;
      flex-direction:column;
      overflow-y:auto;               /* libera rolagem vertical */
      -webkit-overflow-scrolling:touch;
    }
    .iframe-page{
      flex:1 0 auto;                /* ocupa todo o espaço disponível */
      width:100%;
      border:none;
      background:var(--card-bg);
    }
    /* ↑↑↑ ---------------- ↑↑↑ */

    .content-inner{padding:2rem;flex:1;background:var(--card-bg);overflow-y:auto;}
    .content-inner h1{margin-bottom:.75rem;}

    /* ---------- Botão menu mobile ---------- */
    .menu-btn{
      display:none;cursor:pointer;border:none;background:none;
      font-size:1.5rem;color:var(--text-main);
      margin-right:1rem;
    }

    /* ---------- Overlay mobile ---------- */
    .overlay{
      position:fixed;inset:0;background:rgba(0,0,0,.55);
      backdrop-filter:blur(2px);
      z-index:150;opacity:0;pointer-events:none;
      transition:opacity .3s;
    }
    .overlay.show{opacity:1;pointer-events:auto;}

    /* ---------- Responsividade ---------- */
    @media(max-width:768px){
      body{flex-direction:column;}

      /* hamburger visível */
      .menu-btn{display:block;}

      /* sidebar escondida por padrão */
      .sidebar{
        position:fixed;left:0;top:0;height:100vh;
        transform:translateX(-100%);
      }
      .sidebar.open{
        animation:slideIn .35s forwards;
      }
      .sidebar.close{
        animation:slideOut .35s forwards;
      }

      /* navegação horizontal oculta, usamos burger; logo menor */
      .sidebar h2{padding:1.2rem 1.5rem;font-size:1.1rem;}

      .header{
        padding:.6rem 1rem;justify-content:flex-start;gap:.8rem;
      }
      .header .user{font-size:.95rem;margin-left:auto;}
      .sync-btn{font-size:.9rem;padding:.45rem .9rem;}
    }

    @media(max-width:480px){
      .header .user{font-size:.9rem;}
      .nav-link{font-size:.9rem;}
      .logout-btn{font-size:.9rem;}
    }
    @media(max-width:360px){
      .nav-link{font-size:.85rem;padding:.8rem 1rem;}
    }
  </style>
</head>
<body>

  <!-- Overlay para fechar menu tocando fora -->
  <div id="overlay" class="overlay"></div>

  <!-- ===== SIDEBAR ===== -->
  <aside id="sidebar" class="sidebar">
    <h2>LATAM ADM</h2>
    <div class="nav-link active" data-section="dashboard">🏠 Início</div>
    <div class="nav-link" data-section="estoque">📦 Estoque</div>
    <div class="nav-link" data-section="anexos">📂 Arquivos</div>
    <div class="nav-link" id="messagesLink" data-section="mensagens">
      💬 Mensagens
      <span id="msgBadge" class="badge"></span>
    </div>
    <div class="logout-btn" id="logout">🚪 Sair</div>
  </aside>

  <!-- ===== MAIN ===== -->
  <section class="main">
    <header class="header">
      <button id="menuBtn" class="menu-btn" aria-label="Abrir menu">☰</button>
      <div class="user" id="userName"></div>
      <button class="sync-btn" id="syncBtn">🔄 Sincronizar</button>
    </header>

    <div class="content" id="content"></div>
  </section>

<script>
/* ---------- Proteção de rota ---------- */
const currentUser = JSON.parse(localStorage.getItem("currentUser"));
if(!currentUser) location.href="login.html";

/* ---------- Nome do usuário ---------- */
document.getElementById("userName").innerHTML =
  currentUser.nome +
  (currentUser.tipo==="Supervisor"
    ? ' <span style="color:#c41230">(Supervisor)</span>'
    : " (Administrador)");

/* ---------- Navegação lateral ---------- */
const sidebar   = document.getElementById("sidebar");
const overlay   = document.getElementById("overlay");
const menuBtn   = document.getElementById("menuBtn");
const navLinks  = document.querySelectorAll(".nav-link");
const content   = document.getElementById("content");
const msgBadge  = document.getElementById("msgBadge");

/* ---- abrir/fechar menu mobile ---- */
function openMenu(){
  sidebar.classList.remove("close");
  sidebar.classList.add("open");
  overlay.classList.add("show");
}
function closeMenu(){
  sidebar.classList.remove("open");
  sidebar.classList.add("close");
  overlay.classList.remove("show");
}
menuBtn.addEventListener("click",openMenu);
overlay.addEventListener("click",closeMenu);

/* ---- links ---- */
navLinks.forEach(link=>{
  link.addEventListener("click",()=>{
    navLinks.forEach(l=>l.classList.remove("active"));
    link.classList.add("active");
    renderSection(link.dataset.section);
    if(window.innerWidth<=768) closeMenu();   // fecha após seleção
  });
});

/* ---------- Renderização das seções ---------- */
function renderSection(section){
  switch(section){
    case "estoque":
      content.innerHTML='<iframe src="estoque.html" class="iframe-page"></iframe>';
      break;
    case "anexos":
      content.innerHTML='<iframe src="arquivos.html" class="iframe-page"></iframe>';
      break;
    case "mensagens":
      content.innerHTML='<iframe src="mensagens.html" class="iframe-page"></iframe>';
      clearAllUnread();                      // remove badge ao entrar na área de mensagens
      break;
    default:
      content.innerHTML=`
        <div class="content-inner">
          <h1>Bem-vindo(a) ao LATAM ADM</h1>
          <p>Escolha uma opção no menu para começar.</p>
        </div>`;
  }
}
renderSection("dashboard");

/* ---------- Botão Sincronizar ---------- */
document.getElementById("syncBtn").addEventListener("click",syncNow);
function syncNow(){
  const active = document.querySelector(".nav-link.active").dataset.section;
  if(active==="dashboard"){location.reload();return;}

  const iframe = content.querySelector("iframe");
  if(iframe){
    const src=iframe.src;iframe.src="";setTimeout(()=>iframe.src=src,50);
  }
  const btn=document.getElementById("syncBtn");
  btn.textContent="✅ Sincronizado";
  setTimeout(()=>btn.textContent="🔄 Sincronizar",1500);
}

/* ---------- Logout ---------- */
document.getElementById("logout").addEventListener("click",()=>{
  localStorage.removeItem("currentUser");
  location.href="index.html";
});

/* ========================================================================= */
/* ===================      SISTEMA DE NOTIFICAÇÃO      ==================== */
/* ========================================================================= */
const API_URL     = "https://script.google.com/macros/s/AKfycbxZ8ogL76p3vIUPZsiPLv9XnAhN1Z6KWK3IhRgKyGMUYN-2AmxQYUuO2v8i-PQxSpP_Cg/exec";
const SHEET_MSGS  = "MENSAGENS";

/* --- util GET planilha --- */
async function fetchSheet(sheet){
  const res = await fetch(`${API_URL}?sheet=${encodeURIComponent(sheet)}`);
  if(!res.ok) throw new Error(await res.text());
  return res.json();
}

/* --- ler último horário visualizado --- */
function getLastRead(){
  return Number(localStorage.getItem("msgsLastRead")||0);
}
function setLastRead(time){
  localStorage.setItem("msgsLastRead",String(time));
}

/* --- exibe ou esconde badge --- */
function toggleBadge(show){
  msgBadge.style.display = show ? "block" : "none";
}

/* --- verifica se há mensagens não lidas --- */
async function checkForNewMessages(){
  try{
    const msgs = await fetchSheet(SHEET_MSGS);
    const lastRead = getLastRead();

    const hasUnread = msgs.some(m =>
      m.para === currentUser.nome && new Date(m.data).getTime() > lastRead
    );
    toggleBadge(hasUnread);
  }catch(e){
    console.error("Erro ao verificar mensagens:",e);
  }
}

/* --- limpar badge manualmente (ao entrar em mensagens) --- */
function clearAllUnread(){
  setLastRead(Date.now());
  toggleBadge(false);
}

/* --- ouvir mensagem do iframe indicando leitura específica --- */
window.addEventListener("message",(e)=>{
  if(e.data && e.data.type === "read"){
    clearAllUnread();
  }
});

/* --- pooling a cada 30 s --- */
checkForNewMessages();
setInterval(checkForNewMessages,30_000);
</script>
</body>
</html>
